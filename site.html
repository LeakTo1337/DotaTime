<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DotaTime</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* единая тёмная тема для всего сайта — фон темнее всего остального */
    --bg: #0a0a0f;
    --card: #1c1c28;
    --card2: #14141e;
    --line: #ffffff18;
    --text: #e8e2d0;
    --muted: #7a7065;
    --red: #cc1a1a;
    --red-hot: #ff2b2b;
    --ok: #6bcc6b;
  }

  html, body {
    width: 100%; height: 100%;
    background-color: var(--bg);
    background-image:
      linear-gradient(#1a1a2a 1px, transparent 1px),
      linear-gradient(90deg, #1a1a2a 1px, transparent 1px);
    background-size: 40px 40px;
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .screen {
    display: none;
    position: fixed; inset: 0;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2rem;
  }
  .screen.active { display: flex; }

  /* ───────── START / LANDING ───────── */
  #start-screen { gap: 2rem; transition: opacity .5s ease, transform .5s ease; }
  #start-screen.leaving { opacity: 0; transform: scale(1.08); }

  .hero-pic-wrap {
    width: min(58vw, 440px);
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 40px #ff000033, 0 0 0 1px var(--line);
    border: 2px solid #ff2b2b33;
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
  }
  .hero-pic-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-pic-fallback {
    font-family: 'Creepster', cursive;
    color: var(--red-hot);
    font-size: 1.8rem;
    letter-spacing: .06em;
    text-align: center;
    padding: .8rem;
    text-shadow: 0 0 16px #ff000088;
  }
  .hero-pic-fallback span {
    display: block;
    font-family: 'Oswald', sans-serif;
    font-size: .7rem; font-weight: 400;
    color: var(--muted); letter-spacing: .02em;
    margin-top: .5rem;
    text-shadow: none;
  }

  .enter-btn {
    padding: .95rem 3.6rem;
    font-family: 'Oswald', sans-serif;
    font-size: 1.3rem; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #6b0000 0%, #cc1a1a 50%, #6b0000 100%);
    border: 2px solid #ff2b2b55;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 6px 22px #cc1a1a33;
    transition: transform .15s, box-shadow .15s;
  }
  .enter-btn:hover { transform: scale(1.04); box-shadow: 0 0 50px #ff2b2b77; }
  .enter-btn:active { transform: scale(.97); }

  /* ───────── HUB ───────── */
  #hub-screen { justify-content: flex-start; padding-top: 6.5rem; gap: 3rem; }

  .hub-header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 5rem;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.8rem;
    background: linear-gradient(var(--bg)ee, var(--bg)00);
  }
  .hub-logo {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.5rem; color: var(--red-hot);
    text-shadow: 0 0 10px #ff000055;
    letter-spacing: .06em;
    cursor: pointer;
  }

  .hub-title { font-size: clamp(1.9rem, 4.2vw, 2.8rem); font-weight: 700; letter-spacing: .28em; text-align: center; color: var(--muted); text-transform: uppercase; }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.6rem;
    width: min(820px, 94vw);
  }

  .game-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2.4rem 1.4rem;
    display: flex; flex-direction: column; align-items: center; gap: .9rem;
    cursor: pointer;
    box-shadow: 0 4px 18px #00000033;
    transition: all .18s;
  }
  .game-card:not(.locked):hover {
    border-color: var(--red);
    box-shadow: 0 10px 34px #cc1a1a44;
    transform: translateY(-4px);
  }
  .game-card-icon { font-size: 3.2rem; }
  .game-card-title { font-weight: 700; font-size: 1.35rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
  .game-card-desc { font-size: .9rem; color: var(--muted); text-align: center; }
  .game-card.locked { opacity: .45; cursor: default; filter: grayscale(1); }

  /* ───────── PROFILE WIDGET ───────── */
  .profile-widget { position: relative; }
  .avatar-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--card2);
    border: 2px solid var(--line);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-size: 1.8rem;
    transition: border-color .15s;
  }
  .avatar-btn:hover { border-color: var(--red); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

  /* ───────── MODAL (профиль) ───────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 500;
    background: #000000aa;
    align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    width: min(480px, 94vw);
    max-height: 88vh;
    overflow-y: auto;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2.2rem;
    display: flex; flex-direction: column; gap: 1.3rem;
    box-shadow: 0 20px 60px #00000066;
  }
  .modal h2 {
    font-family: 'Creepster', cursive;
    color: var(--red-hot);
    font-size: 1.6rem; letter-spacing: .04em;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close { cursor: pointer; color: var(--muted); font-size: 1.4rem; background:none; border:none; }
  .modal-close:hover { color: var(--text); }

  .profile-row { display: flex; align-items: center; gap: 1rem; }
  .profile-avatar-big {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--line);
    overflow: hidden; display:flex; align-items:center; justify-content:center; font-size:2.2rem;
    flex-shrink: 0;
  }
  .profile-avatar-big img { width:100%; height:100%; object-fit:cover; }

  .field-label { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .35rem; display:block; }
  .field-input {
    width: 100%; padding: .6rem .75rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: 'Oswald', sans-serif; font-size: .95rem;
  }
  .field-input:focus { outline: none; border-color: var(--red); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
  .stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .9rem; text-align: center; }
  .stat-num { font-size: 1.6rem; font-weight: 700; color: var(--red-hot); }
  .stat-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  /* ───────── Мидость: экраны вопрос/результат (тот же фон, что и везде) ───────── */
  #question-screen, #result-screen { gap: 1.5rem; }
  .back-btn {
    position: fixed; top: 1.2rem; left: 1.2rem;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    padding: .4rem .9rem; border-radius: 6px; cursor: pointer; font-family:'Oswald',sans-serif;
    letter-spacing: .08em; font-size: .8rem; text-transform: uppercase;
  }
  .back-btn:hover { color: var(--text); border-color: var(--red); }

  .q-text { font-size: clamp(1.2rem, 3.5vw, 2rem); font-weight: 700; letter-spacing: .08em; text-align: center; color: var(--text); padding: 0 1rem; }
  .game-title {
    font-family: 'Creepster', cursive;
    font-size: clamp(2.4rem, 7vw, 4rem);
    color: var(--red-hot);
    text-shadow: 0 0 20px #ff000088, 0 0 60px #ff000033;
    letter-spacing: .06em;
  }
  .heroes { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; width: min(420px, 90vw); }
  .hero-btn {
    padding: .85rem 1rem; font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; transition: all .15s;
  }
  .hero-btn:hover { background: #2a1a1a; border-color: var(--red); box-shadow: 0 0 18px #cc1a1a55; transform: translateY(-2px); }

  #result-screen { gap: 1.8rem; }
  .result-title { font-family: 'Creepster', cursive; font-size: clamp(2rem, 8vw, 4.5rem); color: var(--ok); text-shadow: 0 0 20px #00ff0066; text-align: center; }
  .result-btn { padding: .7rem 2.5rem; font-family: 'Oswald', sans-serif; font-size: 1.1rem; letter-spacing: .2em; text-transform: uppercase; color: #fff; background: #1a2a1a; border: 1px solid #6bcc6b55; border-radius: 4px; cursor: pointer; }
  .result-btn:hover { background: #2a4a2a; box-shadow: 0 0 20px #00ff0044; }

  /* ───────── ДОДЖ ГЕЙМ: выбор ───────── */
  #dodge-select-screen { gap: 1.4rem; padding: 6rem 1rem 2rem; }
  .dodge-section { display: flex; flex-direction: column; align-items: center; gap: .7rem; }
  .dodge-section-label { font-size: .85rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .dodge-row { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; width: min(560px, 92vw); }
  .dodge-option {
    padding: .75rem 1.2rem;
    font-family: 'Oswald', sans-serif; font-size: .95rem; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer; transition: all .15s;
  }
  .dodge-option:hover { border-color: var(--red); transform: translateY(-2px); }
  .dodge-option.selected {
    background: linear-gradient(135deg, #6b0000, #cc1a1a);
    border-color: var(--red-hot);
    color: #fff;
    box-shadow: 0 0 18px #cc1a1a55;
  }
  .dodge-start-btn { display: none; }
  .dodge-start-btn.show { display: inline-block; }

  /* ───────── ДОДЖ ГЕЙМ: сама игра ───────── */
  #dodge-game-screen { gap: 1.6rem; }
  .dodge-stage { display: flex; flex-direction: column; align-items: center; gap: 1.6rem; width: min(520px, 94vw); }

  .hero-icon-box {
    position: absolute; top: 5.5rem; left: 1.4rem;
    width: 72px; height: 72px;
    border-radius: 8px; overflow: hidden;
    border: 2px solid var(--line);
    background: var(--card2);
  }
  .hero-icon-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .gif-stage {
    width: min(480px, 92vw); aspect-ratio: 16 / 10;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .gif-stage img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .dodge-countdown {
    font-family: 'Creepster', cursive;
    font-size: 5rem;
    color: var(--red-hot);
    text-shadow: 0 0 30px #ff000088;
  }

  .skill-panel { display: flex; gap: .6rem; }
  .skill-slot {
    width: 72px; height: 72px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: all .1s;
  }
  .skill-slot:hover { border-color: var(--red); box-shadow: 0 0 14px #cc1a1a55; }
  .skill-slot:active { transform: scale(.93); }
  .skill-slot.disabled { opacity: .4; cursor: default; pointer-events: none; }
  .skill-key {
    position: absolute; top: 2px; left: 5px;
    font-size: .7rem; font-weight: 700; color: var(--muted);
  }
  .skill-name {
    font-size: .58rem; text-align: center; padding: 0 .3rem;
    text-transform: uppercase; letter-spacing: .03em; color: var(--text);
    line-height: 1.15;
  }

  #dodge-result-screen { gap: 1.6rem; }
  .result-title.fail { color: var(--red-hot); text-shadow: 0 0 20px #ff000066; }
  .result-btn.fail-btn { background: #2a1a1a; border: 1px solid #ff2b2b55; }
  .result-btn.fail-btn:hover { background: #4a1a1a; box-shadow: 0 0 20px #ff000044; }

  /* ───────── SPIDER CHAOS ───────── */
  #chaos-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; display: none; overflow: hidden; background: var(--bg); }
  #chaos-layer.active { display: block; }
  .spider { position: absolute; pointer-events: none; line-height: 1; animation: spiderDrop .4s cubic-bezier(.22,1,.36,1) both; will-change: left, top, transform; }
  .spider img { display: block; width: 100%; height: 100%; object-fit: contain; }
  @keyframes spiderDrop { from { opacity:0; transform: scale(0.3) rotate(-40deg); } to { opacity:1; transform: scale(1) rotate(0deg); } }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr; }
    .enter-btn { padding: .85rem 2.6rem; font-size: 1.15rem; }
  }
</style>
</head>
<body>

<!-- ═══════════ START / LANDING ═══════════ -->
<div id="start-screen" class="screen active">
  <div class="hero-pic-wrap" id="hero-pic-wrap">
    <img id="hero-pic" src="pic1.png" alt="DotaTime"
         onerror="document.getElementById('hero-pic-wrap').innerHTML='<div class=&quot;hero-pic-fallback&quot;>DOTATIME<span>положи файл pic1.png (1254×1254) рядом с index.html</span></div>'">
  </div>
  <button class="enter-btn" onclick="enterSite()">▶ ВОЙТИ</button>
</div>

<!-- ═══════════ HUB (мини-режимы) ═══════════ -->
<div id="hub-screen" class="screen">
  <header class="hub-header">
    <div class="hub-logo" onclick="goHub()">spiceadept</div>
    <div class="profile-widget">
      <button class="avatar-btn" id="avatar-btn" onclick="openProfile()">👤</button>
    </div>
  </header>
  <div class="hub-title">выбери режим</div>
  <div class="games-grid">
    <div class="game-card" onclick="openGame('midost')">
      <div class="game-card-icon">🕷️</div>
      <div class="game-card-title">Мидость</div>
      <div class="game-card-desc">тест на мид™</div>
    </div>
    <div class="game-card" onclick="openGame('dodge')">
      <div class="game-card-icon">🛡️</div>
      <div class="game-card-title">Додж Гейм</div>
      <div class="game-card-desc">успей задоджить</div>
    </div>
    <div class="game-card locked">
      <div class="game-card-icon">🔒</div>
      <div class="game-card-title">Скоро</div>
      <div class="game-card-desc">новый режим в разработке</div>
    </div>
  </div>
</div>

<!-- ═══════════ Мидость: QUESTION ═══════════ -->
<div id="question-screen" class="screen">
  <button class="back-btn" onclick="goHub()">← В МЕНЮ</button>
  <div class="game-title">МИДОСТЬ</div>
  <div class="q-text">Кого вы бы пикнули на мид?</div>
  <div class="heroes">
    <button class="hero-btn" onclick="pickHero('Кез')">КЕЗ</button>
    <button class="hero-btn" onclick="pickHero('Бруда')">БРУДА</button>
    <button class="hero-btn" onclick="pickHero('Шейкер')">ШЕЙКЕР</button>
    <button class="hero-btn" onclick="pickHero('СФ')">СФ</button>
  </div>
</div>

<!-- ═══════════ Мидость: RESULT ═══════════ -->
<div id="result-screen" class="screen">
  <button class="back-btn" onclick="goHub()">← В МЕНЮ</button>
  <div class="result-title">✅ ТЕСТ ПРОЙДЕН</div>
  <div class="result-sub">Ты определённо не еблан</div>
  <button class="result-btn" onclick="goHub()">↩ В МЕНЮ</button>
</div>

<!-- ═══════════ ДОДЖ ГЕЙМ: ВЫБОР ═══════════ -->
<div id="dodge-select-screen" class="screen">
  <button class="back-btn" onclick="goHub()">← В МЕНЮ</button>
  <div class="game-title">ДОДЖ ГЕЙМ</div>

  <div class="dodge-section">
    <div class="dodge-section-label">Чем доджить</div>
    <div class="dodge-row" id="dodge-ability-row"></div>
  </div>

  <div class="dodge-section">
    <div class="dodge-section-label">Что доджить</div>
    <div class="dodge-row" id="dodge-target-row"></div>
  </div>

  <button class="enter-btn dodge-start-btn" id="dodge-start-btn" onclick="startDodgeGame()">▶ НАЧАТЬ</button>
</div>

<!-- ═══════════ ДОДЖ ГЕЙМ: ИГРА ═══════════ -->
<div id="dodge-game-screen" class="screen">
  <div class="hero-icon-box">
    <img src="gif/dodgegame/hero.gif" alt="hero" onerror="this.style.display='none'">
  </div>

  <div class="dodge-stage">
    <div class="gif-stage" id="dodge-gif-stage">
      <div class="dodge-countdown" id="dodge-countdown">3</div>
    </div>

    <div class="skill-panel">
      <div class="skill-slot" id="dodge-skill-slot" onclick="pressDodgeSkill()">
        <span class="skill-key">D</span>
        <span class="skill-name" id="dodge-skill-name"></span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ ДОДЖ ГЕЙМ: РЕЗУЛЬТАТ ═══════════ -->
<div id="dodge-result-screen" class="screen">
  <div class="result-title" id="dodge-result-title">✅ ЗАДОДЖЕНО</div>
  <div class="result-sub" id="dodge-result-sub"></div>
  <div style="display:flex; gap:1rem; flex-wrap: wrap; justify-content:center;">
    <button class="result-btn" id="dodge-retry-btn" onclick="restartDodgeSelect()">↻ ЗАНОВО</button>
    <button class="result-btn" onclick="goHub()">🏠 В МЕНЮ</button>
  </div>
</div>

<!-- ═══════════ PROFILE MODAL (без регистрации) ═══════════ -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <h2>Профиль <button class="modal-close" onclick="closeProfile()">✕</button></h2>

    <div class="profile-row">
      <div class="profile-avatar-big" id="profile-avatar-big">👤</div>
      <div style="flex:1;">
        <label class="field-label">Ник</label>
        <input class="field-input" id="name-input" placeholder="Твой ник" oninput="onNameInput()">
      </div>
    </div>

    <div>
      <label class="field-label">Аватар</label>
      <input type="file" accept="image/*" class="field-input" id="avatar-input" onchange="onAvatarChange(event)">
    </div>

    <div>
      <label class="field-label">Описание</label>
      <input class="field-input" id="info-input" placeholder="Пара слов о себе" oninput="onInfoInput()">
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num" id="stat-games">0</div>
        <div class="stat-label">игр пройдено</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-time">00:00</div>
        <div class="stat-label">время на сайте</div>
      </div>
    </div>
  </div>
</div>

<!-- SOUND -->
<audio id="bruda-sound" src="spider.mp3" preload="auto" loop></audio>

<!-- CHAOS -->
<div id="chaos-layer"></div>

<script>
/* ════════════════════════════════════════════════════════════
   ХРАНИЛИЩЕ (локально, в браузере; без аккаунтов и GitHub)
   ════════════════════════════════════════════════════════════ */
const memStore = {};
function storeGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch (e) {
    return key in memStore ? memStore[key] : fallback;
  }
}
function storeSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { memStore[key] = value; }
}

/* ════════════════════════════════════════════════════════════
   СОСТОЯНИЕ (никакой регистрации — просто локальный профиль)
   ════════════════════════════════════════════════════════════ */
let profile = storeGet('dotatime_profile', { name: '', avatar: '', info: '' });
let stats = storeGet('dotatime_stats', { gamesPlayed: 0, secondsOnSite: 0 });
let sessionTimerHandle = null;

/* ════════════════════════════════════════════════════════════
   НАВИГАЦИЯ
   ════════════════════════════════════════════════════════════ */
function showOnly(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function enterSite() {
  const start = document.getElementById('start-screen');
  start.classList.add('leaving');
  setTimeout(() => {
    start.classList.remove('leaving');
    showOnly('hub-screen');
    startSessionTimer();
  }, 480);
}

function goHub() {
  if (typeof clearDodgeTimers === 'function') clearDodgeTimers();
  if (typeof dodgeKeyHandler === 'function') document.removeEventListener('keydown', dodgeKeyHandler);
  if (typeof dodgeAttackStart !== 'undefined') dodgeAttackStart = 0;
  showOnly('hub-screen');
}

function openGame(id) {
  if (id === 'midost') showOnly('question-screen');
  if (id === 'dodge') openDodgeSelect();
}

/* время на сайте копится, пока открыт хаб/игра (не на стартовом экране) */
function startSessionTimer() {
  if (sessionTimerHandle) return;
  sessionTimerHandle = setInterval(() => {
    stats.secondsOnSite += 1;
    storeSet('dotatime_stats', stats);
    renderStats();
  }, 1000);
}

function renderStats() {
  document.getElementById('stat-games').textContent = stats.gamesPlayed;
  const s = stats.secondsOnSite;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('stat-time').textContent = h > 0 ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

/* ════════════════════════════════════════════════════════════
   ПРОФИЛЬ (без входа — ник/аватар/описание только локально)
   ════════════════════════════════════════════════════════════ */
function openProfile() {
  document.getElementById('profile-modal').classList.add('active');
  renderProfile();
}
function closeProfile() { document.getElementById('profile-modal').classList.remove('active'); }

function renderProfile() {
  document.getElementById('name-input').value = profile.name || '';
  document.getElementById('info-input').value = profile.info || '';
  const avBig = document.getElementById('profile-avatar-big');
  const avatarBtn = document.getElementById('avatar-btn');
  avBig.innerHTML = profile.avatar ? `<img src="${profile.avatar}">` : '👤';
  avatarBtn.innerHTML = profile.avatar ? `<img src="${profile.avatar}">` : '👤';
  renderStats();
}

function persistProfile() { storeSet('dotatime_profile', profile); }

function onNameInput() { profile.name = document.getElementById('name-input').value; persistProfile(); renderProfile(); }
function onInfoInput() { profile.info = document.getElementById('info-input').value; persistProfile(); }
function onAvatarChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    profile.avatar = reader.result; // data URL, только в браузере
    persistProfile();
    renderProfile();
  };
  reader.readAsDataURL(file);
}

window.addEventListener('load', renderProfile);

/* ════════════════════════════════════════════════════════════
   МИДОСТЬ — игра (логика без изменений)
   ════════════════════════════════════════════════════════════ */
const MAX_SPIDERS = 1000;
const SPIDER_GIFS = ['gif/spiders/spider1.gif','gif/spiders/spider2.gif','gif/spiders/spider3.gif','gif/spiders/spider4.gif','gif/spiders/spider5.gif'];
let chaosActive = false;
let spiderEls = [];

function playBrudaSound() {
  const a = document.getElementById('bruda-sound');
  if (!a) return;
  a.volume = 0.6;
  a.currentTime = 0;
  a.play().catch(e => console.log("Audio error:", e));
  return a;
}
function stopBrudaSound() {
  const a = document.getElementById('bruda-sound');
  if (a) { a.pause(); a.currentTime = 0; }
}

function pickHero(name) {
  if (name === 'Бруда') {
    const audio = playBrudaSound();
    startChaos(audio);
  } else {
    finishGame();
  }
}

function finishGame() {
  stats.gamesPlayed += 1;
  storeSet('dotatime_stats', stats);
  renderStats();
  showOnly('result-screen');
}

function startChaos(audio) {
  chaosActive = true;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const layer = document.getElementById('chaos-layer');
  layer.innerHTML = '';
  spiderEls = [];
  layer.classList.add('active');

  const attackDuration = (audio && audio.duration) ? audio.duration * 1000 : 18000;

  for (let i = 0; i < 80; i++) setTimeout(() => spawnSpider(layer), i * 6);

  const spawnInterval = 28;
  function spawnLoop() {
    if (!chaosActive || spiderEls.length >= MAX_SPIDERS) return;
    spawnSpider(layer);
    setTimeout(spawnLoop, spawnInterval);
  }
  spawnLoop();

  const shuffleInterval = setInterval(() => { if (chaosActive) randomisePositions(); }, 550);
  setTimeout(() => endChaos(shuffleInterval), attackDuration);
}

function spawnSpider(layer) {
  const size = 40 + Math.random() * 70;
  const el = document.createElement('div');
  el.className = 'spider';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = Math.random() * (window.innerWidth - size) + 'px';
  el.style.top = Math.random() * (window.innerHeight - size) + 'px';
  const img = document.createElement('img');
  img.src = SPIDER_GIFS[Math.floor(Math.random() * SPIDER_GIFS.length)];
  img.alt = ''; img.draggable = false;
  el.appendChild(img);
  layer.appendChild(el);
  spiderEls.push(el);
}

function randomisePositions() {
  spiderEls = spiderEls.filter(el => el.isConnected);
  spiderEls.forEach(el => {
    const w = parseFloat(el.style.width) || 60;
    const h = parseFloat(el.style.height) || 60;
    el.style.left = Math.random() * (window.innerWidth - w) + 'px';
    el.style.top = Math.random() * (window.innerHeight - h) + 'px';
  });
}

function endChaos(shuffleInterval) {
  chaosActive = false;
  clearInterval(shuffleInterval);
  stopBrudaSound();
  spiderEls.forEach((el, i) => {
    setTimeout(() => {
      el.style.transition = 'transform .45s, opacity .45s';
      el.style.transform = 'scale(0) rotate(720deg)';
      el.style.opacity = '0';
    }, i * 10);
  });
  setTimeout(() => {
    const layer = document.getElementById('chaos-layer');
    layer.innerHTML = '';
    layer.classList.remove('active');
    spiderEls = [];
    finishGame();
  }, 2500);
}

/* ════════════════════════════════════════════════════════════
   ДОДЖ ГЕЙМ
   ════════════════════════════════════════════════════════════

   Все гифки лежат в папке gif/dodgegame/ (иконка героя — gif/dodgegame/hero.gif)

   Имя файла-результата = <ключЦели><ключСпособности><суффикс>.gif
   Суффиксы: dodge (додж получился), nondodge (герой поймал урон), afk (игрок не нажал вообще)

   Пример (как в задаче): 3 скилл течиса + манта:
     gif/dodgegame/techiesmantadodge.gif      — успешный додж
     gif/dodgegame/techiesmantanondodge.gif   — не задоджил (нажал не вовремя/рано/поздно)
     gif/dodgegame/techiesmantaafk.gif        — вообще не нажал способность
   ════════════════════════════════════════════════════════════ */

/* Способности, которыми доджим (верхний ряд выбора) */
const DODGE_ABILITIES = [
  { key: 'manta', label: 'Манта' },
  { key: 'pak',   label: '3 скилл Пака' },
  { key: 'vk',    label: 'Ульта ВК' }
];

/* То, что доджим (нижний ряд выбора) */
const DODGE_TARGETS = [
  { key: 'techies',   label: '3 скилл Течиса' },
  { key: 'alchemist', label: 'Колба алхимика' },
  { key: 'slardar',   label: '2 скилл Слардара' }
];

/* Тайминги на каждую комбинацию "цель_способность".
   Все значения в миллисекундах — отсчитываются от момента,
   когда закончился отсчёт 3-2-1 и начала играть гифка атаки/прыжка.

   windowStart / windowEnd — окно, в которое нажатие способности = успешный додж
   duration                — сколько всего "длится" атака.
                             Если игрок вообще не нажал способность до этого момента — сыграет afk-гифка.

   ЭТО ЗАГЛУШКА ПОД ТВОИ БУДУЩИЕ ГИФКИ.
   Когда запишешь реальные гифки — подставь сюда точные тайминги под каждую
   пару (когда именно на гифке происходит "контакт", под это и подгоняется окно). */
const DODGE_TIMINGS = {};
DODGE_TARGETS.forEach(t => {
  DODGE_ABILITIES.forEach(a => {
    DODGE_TIMINGS[`${t.key}_${a.key}`] = { windowStart: 700, windowEnd: 1100, duration: 1700 };
  });
});

function dodgeGifPath(targetKey, abilityKey, suffix) {
  return `gif/dodgegame/${targetKey}${abilityKey}${suffix}.gif`;
}

/* состояние текущего забега */
let dodgeChoice = { ability: null, target: null };
let dodgeTimers = [];      // все активные setTimeout, чтобы гасить их при выходе/рестарте
let dodgeResolved = false; // способность уже применена (додж/взрыв/афк) — повторные нажатия игнорим
let dodgeAttackStart = 0;  // performance.now() в момент старта гифки атаки

function clearDodgeTimers() {
  dodgeTimers.forEach(id => clearTimeout(id));
  dodgeTimers = [];
}
function dodgeSetTimeout(fn, ms) {
  const id = setTimeout(fn, ms);
  dodgeTimers.push(id);
  return id;
}

/* ───────── экран выбора ───────── */
function openDodgeSelect() {
  dodgeChoice = { ability: null, target: null };
  renderDodgeRow('dodge-ability-row', DODGE_ABILITIES, 'ability');
  renderDodgeRow('dodge-target-row', DODGE_TARGETS, 'target');
  updateDodgeStartBtn();
  showOnly('dodge-select-screen');
}

function renderDodgeRow(containerId, list, kind) {
  const row = document.getElementById(containerId);
  row.innerHTML = '';
  list.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'dodge-option';
    btn.textContent = item.label;
    btn.onclick = () => selectDodgeOption(kind, item.key, containerId);
    row.appendChild(btn);
  });
}

function selectDodgeOption(kind, key, containerId) {
  dodgeChoice[kind] = key;
  document.querySelectorAll(`#${containerId} .dodge-option`).forEach(btn => {
    btn.classList.toggle('selected', btn.textContent === labelForKey(kind, key));
  });
  updateDodgeStartBtn();
}

function labelForKey(kind, key) {
  const list = kind === 'ability' ? DODGE_ABILITIES : DODGE_TARGETS;
  const found = list.find(i => i.key === key);
  return found ? found.label : '';
}

function updateDodgeStartBtn() {
  const btn = document.getElementById('dodge-start-btn');
  btn.classList.toggle('show', !!(dodgeChoice.ability && dodgeChoice.target));
}

function restartDodgeSelect() {
  clearDodgeTimers();
  openDodgeSelect();
}

/* ───────── сам игровой процесс ───────── */
function startDodgeGame() {
  if (!dodgeChoice.ability || !dodgeChoice.target) return;
  clearDodgeTimers();
  dodgeResolved = false;

  document.getElementById('dodge-skill-name').textContent = labelForKey('ability', dodgeChoice.ability);
  const slot = document.getElementById('dodge-skill-slot');
  slot.classList.remove('disabled');

  const stage = document.getElementById('dodge-gif-stage');
  stage.innerHTML = '<div class="dodge-countdown" id="dodge-countdown">3</div>';

  showOnly('dodge-game-screen');

  let count = 3;
  const countEl = () => document.getElementById('dodge-countdown');
  const tick = () => {
    count -= 1;
    if (count > 0) {
      if (countEl()) countEl().textContent = String(count);
      dodgeSetTimeout(tick, 1000);
    } else {
      beginDodgeAttack();
    }
  };
  dodgeSetTimeout(tick, 1000);

  /* горячая клавиша D дублирует клик по способности */
  document.addEventListener('keydown', dodgeKeyHandler);
}

function dodgeKeyHandler(e) {
  if (e.key && e.key.toLowerCase() === 'd') pressDodgeSkill();
}

function beginDodgeAttack() {
  const stage = document.getElementById('dodge-gif-stage');
  stage.innerHTML = ''; // тут по-хорошему будет играть "нейтральная" анимация начала атаки, если она у тебя будет отдельным файлом

  dodgeAttackStart = performance.now();

  const timing = DODGE_TIMINGS[`${dodgeChoice.target}_${dodgeChoice.ability}`];

  /* если игрок вообще не нажал способность за всё время атаки — afk */
  dodgeSetTimeout(() => {
    if (dodgeResolved) return;
    resolveDodge('afk');
  }, timing.duration);
}

function pressDodgeSkill() {
  if (dodgeResolved) return;
  if (!document.getElementById('dodge-game-screen').classList.contains('active')) return;
  if (dodgeAttackStart === 0) return; // ещё идёт отсчёт 3-2-1, способность пока недоступна

  const timing = DODGE_TIMINGS[`${dodgeChoice.target}_${dodgeChoice.ability}`];
  const elapsed = performance.now() - dodgeAttackStart;

  if (elapsed >= timing.windowStart && elapsed <= timing.windowEnd) {
    resolveDodge('dodge');
  } else {
    resolveDodge('nondodge');
  }
}

function resolveDodge(outcome) {
  if (dodgeResolved) return;
  dodgeResolved = true;
  document.getElementById('dodge-skill-slot').classList.add('disabled');
  document.removeEventListener('keydown', dodgeKeyHandler);

  const stage = document.getElementById('dodge-gif-stage');
  const gifPath = dodgeGifPath(dodgeChoice.target, dodgeChoice.ability, outcome);
  stage.innerHTML = `<img src="${gifPath}" alt="${outcome}">`;

  const timing = DODGE_TIMINGS[`${dodgeChoice.target}_${dodgeChoice.ability}`];
  dodgeSetTimeout(() => finishDodgeGame(outcome), timing.duration);
}

function finishDodgeGame(outcome) {
  dodgeAttackStart = 0;

  if (outcome === 'dodge') {
    stats.gamesPlayed += 1;
    storeSet('dotatime_stats', stats);
    renderStats();
    document.getElementById('dodge-result-title').textContent = '✅ ЗАДОДЖЕНО';
    document.getElementById('dodge-result-title').classList.remove('fail');
    document.getElementById('dodge-result-sub').textContent = 'Ты прошёл Додж Гейм';
  } else {
    const text = outcome === 'afk' ? '💀 НЕ УСПЕЛ' : '💀 НЕ ЗАДОДЖИЛ';
    document.getElementById('dodge-result-title').textContent = text;
    document.getElementById('dodge-result-title').classList.add('fail');
    document.getElementById('dodge-result-sub').textContent = 'Попробуй ещё раз';
  }

  showOnly('dodge-result-screen');
}
</script>
